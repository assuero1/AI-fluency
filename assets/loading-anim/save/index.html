<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"hue","type":"number","label":"Matiz do mascote (graus)","default":0},
    {"id":"sat","type":"number","label":"Saturação do mascote","default":1},
    {"id":"main","type":"color","label":"Cor da seção","default":"#58cc02"},
    {"id":"deep","type":"color","label":"Cor profunda","default":"#58a700"},
    {"id":"soft","type":"color","label":"Cor pastel","default":"#e7f8d5"},
    {"id":"ink","type":"color","label":"Cor de leitura","default":"#417c00"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=640" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 640px;
        height: 640px;
        overflow: hidden;
        background: var(--soft);
        font-family: ui-rounded, "Nunito", system-ui, sans-serif;
      }
      #root { position: relative; width: 640px; height: 640px; overflow: hidden; }
      .clip { position: absolute; }

      #bg {
        inset: 0;
        background: linear-gradient(180deg, var(--soft) 0%, #fdfdfb 72%, #ffffff 100%);
      }
      .blob { position: absolute; border-radius: 50%; }
      #blob1 { width: 340px; height: 340px; left: -90px; top: 48px; background: var(--deep); opacity: 0.07; }
      #blob2 { width: 280px; height: 280px; right: -70px; bottom: 30px; background: var(--main); opacity: 0.06; }

      .mote { position: absolute; border-radius: 50%; background: var(--deep); opacity: 0.18; }
      #mote1 { width: 18px; height: 18px; left: 96px; top: 128px; }
      #mote2 { width: 12px; height: 12px; left: 520px; top: 118px; }

      #ground {
        position: absolute;
        left: 135px; top: 458px;
        width: 250px; height: 36px;
        border-radius: 50%;
        background: var(--deep);
        opacity: 0.13;
      }

      #mascot-breath { position: absolute; left: 110px; top: 138px; width: 300px; height: 333px; }
      #mascot-lean { position: relative; width: 300px; height: 333px; }
      #mascot { position: relative; width: 300px; height: 333px; }
      #mascot-clip { position: relative; width: 300px; height: 333px; overflow: hidden; }
      #mascot-img {
        display: block;
        width: 300px; height: 333px;
        filter: hue-rotate(calc(var(--hue) * 1deg)) saturate(var(--sat));
      }

      #pile {
        position: absolute;
        left: 404px; top: 402px;
        width: 170px; height: 116px;
      }
      #pile-back {
        position: absolute;
        left: 14px; top: 8px;
        width: 142px; height: 92px;
        border-radius: 18px;
        background: var(--deep);
        opacity: 0.35;
        transform: rotate(-7deg);
      }
      #pile-front {
        position: absolute;
        left: 10px; top: 24px;
        width: 150px; height: 92px;
        border-radius: 18px;
        background: var(--main);
        box-shadow: 0 6px 0 var(--deep);
      }
      #pile-check {
        position: absolute;
        left: 63px; top: 44px;
        width: 44px; height: 44px;
        opacity: 0;
      }

      #orb {
        position: absolute;
        left: 466px; top: 40px;
        opacity: 0;
      }

      .burst { position: absolute; border-radius: 50%; background: var(--main); opacity: 0; }
      #burst1 { left: 428px; top: 396px; width: 14px; height: 14px; }
      #burst2 { left: 542px; top: 386px; width: 10px; height: 10px; }
      #burst3 { left: 492px; top: 366px; width: 12px; height: 12px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="save"
      data-start="0"
      data-duration="2.4"
      data-width="640"
      data-height="640"
    >
      <div id="bg" class="clip" data-start="0" data-duration="2.4" data-track-index="0">
        <div id="blob1" class="blob"></div>
        <div id="blob2" class="blob"></div>
      </div>

      <div id="decor" class="clip" data-start="0" data-duration="2.4" data-track-index="1">
        <div id="mote1" class="mote"></div>
        <div id="mote2" class="mote"></div>
      </div>

      <div id="stage" class="clip" data-start="0" data-duration="2.4" data-track-index="2">
        <div id="ground"></div>
        <div id="pile">
          <div id="pile-back"></div>
          <div id="pile-front"></div>
          <svg id="pile-check" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6L9 17l-5-5" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div id="mascot-breath">
          <div id="mascot-lean">
            <div id="mascot">
              <div id="mascot-clip">
                <img id="mascot-img" src="mascot.png" alt="" width="300" height="333" />
              </div>
            </div>
          </div>
        </div>
        <svg id="orb" width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="var(--main)" stroke="var(--deep)" stroke-width="1.4" />
        </svg>
        <div id="burst1" class="burst"></div>
        <div id="burst2" class="burst"></div>
        <div id="burst3" class="burst"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#mascot", { transformOrigin: "50% 100%" });
      gsap.set("#pile", { transformOrigin: "50% 100%" });

      // Respiração — 4 meios-ciclos de 0.6s = 2.4s, termina na pose inicial (loop perfeito)
      tl.fromTo("#mascot-breath", { y: 0 }, { y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#ground", { scaleX: 1 }, { scaleX: 0.94, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

      // Inclina-se para acompanhar o orbe caindo e volta
      tl.fromTo("#mascot-lean", { rotation: 0 }, { rotation: 6, duration: 0.45, ease: "sine.inOut" }, 0.45);
      tl.to("#mascot-lean", { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 1.3);

      // Orbe aparece, cai e quica na pilha
      tl.fromTo("#orb", { autoAlpha: 0, y: 0, scale: 0.6, rotation: -40 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.18, ease: "back.out(2)" }, 0.42);
      tl.to("#orb", { y: 390, duration: 0.5, ease: "power1.in" }, 0.62);
      tl.to("#orb", { y: 362, duration: 0.16, ease: "power1.out" }, 1.12);
      tl.to("#orb", { y: 390, duration: 0.13, ease: "power1.in" }, 1.28);
      tl.to("#orb", { autoAlpha: 0, scale: 0.5, y: 404, duration: 0.2, ease: "power1.in" }, 1.44);

      // Pilha absorve: squash + check + faíscas
      tl.to("#pile", { keyframes: [
        { scaleY: 0.9, scaleX: 1.05, duration: 0.1, ease: "power1.out" },
        { scaleY: 1, scaleX: 1, duration: 0.24, ease: "back.out(2.2)" }
      ] }, 1.12);
      tl.fromTo("#pile-check", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: "back.out(3)" }, 1.34);
      tl.to("#pile-check", { autoAlpha: 0, duration: 0.28, ease: "power1.in" }, 1.92);
      [["#burst1", 1.4], ["#burst2", 1.48], ["#burst3", 1.56]].forEach(([sel, at]) => {
        tl.fromTo(sel, { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.16, ease: "back.out(3)" }, at);
        tl.to(sel, { autoAlpha: 0, scale: 0.3, duration: 0.18, ease: "power1.in" }, at + 0.22);
      });

      // Squash do mascote no impacto
      tl.to("#mascot", { keyframes: [
        { scaleX: 1.05, scaleY: 0.94, duration: 0.1, ease: "power1.out" },
        { scaleX: 1, scaleY: 1, duration: 0.2, ease: "back.out(2)" }
      ] }, 1.12);

      // Motes flutuando (terminam onde começam)
      tl.fromTo("#mote1", { y: 0 }, { y: -10, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#mote2", { y: -8 }, { y: 0, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#blob1", { scale: 1 }, { scale: 1.06, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#blob2", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      window.__timelines["save"] = tl;
    </script>
  </body>
</html>
