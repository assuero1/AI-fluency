<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"hue","type":"number","label":"Matiz do mascote (graus)","default":0},
    {"id":"sat","type":"number","label":"Saturação do mascote","default":1},
    {"id":"main","type":"color","label":"Cor da seção","default":"#58cc02"},
    {"id":"deep","type":"color","label":"Cor profunda","default":"#58a700"},
    {"id":"soft","type":"color","label":"Cor pastel","default":"#e7f8d5"},
    {"id":"ink","type":"color","label":"Cor de leitura","default":"#417c00"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=640" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 640px;
        height: 640px;
        overflow: hidden;
        background: var(--soft);
        font-family: ui-rounded, "Nunito", system-ui, sans-serif;
      }
      #root { position: relative; width: 640px; height: 640px; overflow: hidden; }
      .clip { position: absolute; }

      #bg {
        inset: 0;
        background: linear-gradient(180deg, var(--soft) 0%, #fdfdfb 72%, #ffffff 100%);
      }
      .blob { position: absolute; border-radius: 50%; }
      #blob1 { width: 340px; height: 340px; left: -90px; top: 48px; background: var(--deep); opacity: 0.07; }
      #blob2 { width: 280px; height: 280px; right: -70px; bottom: 30px; background: var(--main); opacity: 0.06; }

      .mote { position: absolute; border-radius: 50%; background: var(--deep); opacity: 0.18; }
      #mote1 { width: 16px; height: 16px; left: 88px; top: 170px; }
      #mote2 { width: 12px; height: 12px; left: 540px; top: 320px; }

      #ground {
        position: absolute;
        left: 195px; top: 470px;
        width: 250px; height: 36px;
        border-radius: 50%;
        background: var(--deep);
        opacity: 0.13;
      }

      #mascot-breath { position: absolute; left: 170px; top: 150px; width: 300px; height: 333px; }
      #mascot-tilt { position: relative; width: 300px; height: 333px; }
      #mascot { position: relative; width: 300px; height: 333px; }
      #mascot-clip { position: relative; width: 300px; height: 333px; overflow: hidden; }
      #mascot-img {
        display: block;
        width: 300px; height: 333px;
        filter: hue-rotate(calc(var(--hue) * 1deg)) saturate(var(--sat));
      }

      #bubble {
        position: absolute;
        left: 368px; top: 64px;
        width: 176px; height: 118px;
        background: #ffffff;
        border-radius: 36px;
        box-shadow: 0 6px 0 var(--soft), 0 14px 28px rgba(31, 31, 31, 0.08);
        display: flex; align-items: center; justify-content: center;
      }
      #trail1 { position: absolute; left: 344px; top: 190px; width: 22px; height: 22px; border-radius: 50%; background: #ffffff; box-shadow: 0 4px 0 var(--soft); }
      #trail2 { position: absolute; left: 326px; top: 218px; width: 13px; height: 13px; border-radius: 50%; background: #ffffff; box-shadow: 0 3px 0 var(--soft); }

      #dots { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; }
      .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--main); opacity: 0; }

      .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; color: var(--ink); opacity: 0; }

      .twinkle { position: absolute; opacity: 0; }
      #tw1 { left: 348px; top: 44px; }
      #tw2 { left: 556px; top: 96px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="think"
      data-start="0"
      data-duration="2.4"
      data-width="640"
      data-height="640"
    >
      <div id="bg" class="clip" data-start="0" data-duration="2.4" data-track-index="0">
        <div id="blob1" class="blob"></div>
        <div id="blob2" class="blob"></div>
      </div>

      <div id="decor" class="clip" data-start="0" data-duration="2.4" data-track-index="1">
        <div id="mote1" class="mote"></div>
        <div id="mote2" class="mote"></div>
      </div>

      <div id="stage" class="clip" data-start="0" data-duration="2.4" data-track-index="2">
        <div id="ground"></div>
        <div id="mascot-breath">
          <div id="mascot-tilt">
            <div id="mascot">
              <div id="mascot-clip">
                <img id="mascot-img" src="mascot.png" alt="" width="300" height="333" />
              </div>
            </div>
          </div>
        </div>
        <div id="trail1"></div>
        <div id="trail2"></div>
        <div id="bubble">
          <div id="dots">
            <div id="dot1" class="dot"></div>
            <div id="dot2" class="dot"></div>
            <div id="dot3" class="dot"></div>
          </div>
          <div id="glyphA" class="glyph">?</div>
          <div id="glyphB" class="glyph">!</div>
        </div>
        <svg id="tw1" class="twinkle" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="var(--main)" />
        </svg>
        <svg id="tw2" class="twinkle" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="var(--deep)" />
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#mascot", { transformOrigin: "50% 100%" });
      gsap.set("#bubble", { transformOrigin: "15% 95%" });

      // Respiração + cabeça inclinando (ambos terminam na pose inicial)
      tl.fromTo("#mascot-breath", { y: 0 }, { y: -8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#mascot-tilt", { rotation: -2.5 }, { rotation: 2.5, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#ground", { scaleX: 1 }, { scaleX: 0.94, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

      // Um ciclo de pensamento: pontos -> glifo -> absorve (1.2s, rodado 2x)
      function thoughtCycle(t0, glyphSel) {
        tl.set("#dots", { autoAlpha: 1, scale: 1 }, t0);
        [["#dot1", 0], ["#dot2", 0.1], ["#dot3", 0.2]].forEach(([sel, off]) => {
          tl.fromTo(sel, { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.14, ease: "back.out(2.4)" }, t0 + off);
        });
        tl.to("#dots", { autoAlpha: 0, scale: 0.7, duration: 0.14, ease: "power1.in" }, t0 + 0.5);
        tl.fromTo(glyphSel, { autoAlpha: 0, scale: 0.5, rotation: -12 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.2, ease: "back.out(2.6)" }, t0 + 0.66);
        tl.to("#bubble", { scale: 1.05, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0 + 0.88);
        tl.to(glyphSel, { autoAlpha: 0, scale: 1.25, duration: 0.16, ease: "power1.in" }, t0 + 1.02);
      }
      thoughtCycle(0, "#glyphA");
      thoughtCycle(1.2, "#glyphB");

      // Brilhos piscando perto da bolha
      tl.fromTo("#tw1", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#tw2", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 0.9, scale: 1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.3);

      // Motes e blobs em ciclo fechado
      tl.fromTo("#mote1", { y: 0 }, { y: -9, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#mote2", { y: -7 }, { y: 0, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#blob1", { scale: 1 }, { scale: 1.06, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#blob2", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      window.__timelines["think"] = tl;
    </script>
  </body>
</html>
