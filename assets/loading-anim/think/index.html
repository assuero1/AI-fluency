<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"hue","type":"number","label":"Matiz do mascote (graus)","default":0},
    {"id":"sat","type":"number","label":"Saturação do mascote","default":1},
    {"id":"main","type":"color","label":"Cor da seção","default":"#58cc02"},
    {"id":"deep","type":"color","label":"Cor profunda","default":"#58a700"},
    {"id":"soft","type":"color","label":"Cor pastel","default":"#e7f8d5"},
    {"id":"ink","type":"color","label":"Cor de leitura","default":"#417c00"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=640" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 640px;
        height: 640px;
        overflow: hidden;
        background: var(--soft);
        font-family: "Nunito", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #root { position: relative; width: 640px; height: 640px; overflow: hidden; }
      .clip { position: absolute; }

      #bg {
        inset: 0;
        background: linear-gradient(180deg, var(--soft) 0%, #fdfdfb 70%, #ffffff 100%);
      }
      .blob { position: absolute; border-radius: 50%; }
      #blob1 { width: 340px; height: 340px; left: -90px; top: 48px; background: var(--deep); opacity: 0.08; }
      #blob2 { width: 280px; height: 280px; right: -70px; bottom: 30px; background: var(--main); opacity: 0.07; }

      .mote { position: absolute; border-radius: 50%; background: var(--deep); opacity: 0.16; }
      #mote1 { width: 16px; height: 16px; left: 88px; top: 170px; }
      #mote2 { width: 12px; height: 12px; left: 540px; top: 320px; }

      #ground {
        position: absolute;
        left: 195px; top: 470px;
        width: 250px; height: 36px;
        border-radius: 50%;
        background: var(--deep);
        opacity: 0.14;
        transform-origin: 50% 50%;
      }

      #mascot-breath { position: absolute; left: 170px; top: 150px; width: 300px; height: 333px; }
      #mascot-tilt { position: relative; width: 300px; height: 333px; transform-origin: 50% 100%; }
      #mascot { position: relative; width: 300px; height: 333px; transform-origin: 50% 100%; }
      #mascot-clip { position: relative; width: 300px; height: 333px; overflow: hidden; }
      #mascot-img {
        display: block;
        width: 300px; height: 333px;
        filter: hue-rotate(calc(var(--hue) * 1deg)) saturate(var(--sat));
      }

      #bubble {
        position: absolute;
        left: 368px; top: 62px;
        width: 180px; height: 122px;
        background: linear-gradient(145deg, #ffffff 0%, var(--soft) 220%);
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 38px;
        box-shadow: 0 7px 0 var(--soft), 0 16px 32px rgba(31, 31, 31, 0.08);
        display: flex; align-items: center; justify-content: center;
        transform-origin: 18% 95%;
      }
      #trail1 {
        position: absolute;
        left: 342px; top: 190px;
        width: 24px; height: 24px;
        border-radius: 50%;
        background: #ffffff;
        border: 2px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 4px 0 var(--soft);
      }
      #trail2 {
        position: absolute;
        left: 324px; top: 220px;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 3px 0 var(--soft);
      }

      #dots {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .dot {
        width: 18px; height: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--main) 0%, var(--deep) 100%);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        transform-origin: 50% 50%;
      }

      /* Insight Icon (Estrela inteligente / epifania em SVG estilizado) */
      #insight-icon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform-origin: 50% 50%;
      }
      #insight-svg {
        width: 56px; height: 56px;
        filter: drop-shadow(0 4px 10px var(--main));
      }

      .twinkle { position: absolute; opacity: 0; transform-origin: 50% 50%; }
      #tw1 { left: 344px; top: 40px; }
      #tw2 { left: 560px; top: 88px; }
      #tw3 { left: 450px; top: 26px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="think"
      data-start="0"
      data-duration="2.4"
      data-width="640"
      data-height="640"
    >
      <div id="bg" class="clip" data-start="0" data-duration="2.4" data-track-index="0">
        <div id="blob1" class="blob"></div>
        <div id="blob2" class="blob"></div>
      </div>

      <div id="decor" class="clip" data-start="0" data-duration="2.4" data-track-index="1">
        <div id="mote1" class="mote"></div>
        <div id="mote2" class="mote"></div>
      </div>

      <div id="stage" class="clip" data-start="0" data-duration="2.4" data-track-index="2">
        <div id="ground"></div>
        <div id="mascot-breath">
          <div id="mascot-tilt">
            <div id="mascot">
              <div id="mascot-clip">
                <img id="mascot-img" src="mascot.png" alt="" width="300" height="333" />
              </div>
            </div>
          </div>
        </div>
        <div id="trail1"></div>
        <div id="trail2"></div>
        <div id="bubble">
          <div id="dots">
            <div id="dot1" class="dot"></div>
            <div id="dot2" class="dot"></div>
            <div id="dot3" class="dot"></div>
          </div>
          <div id="insight-icon">
            <svg id="insight-svg" viewBox="0 0 32 32" aria-hidden="true">
              <!-- Centelha central de IA e sabedoria -->
              <path d="M16 2 L19.5 12.5 L30 16 L19.5 19.5 L16 30 L12.5 19.5 L2 16 L12.5 12.5 Z" fill="var(--main)" stroke="var(--deep)" stroke-width="1.2" />
              <circle cx="16" cy="16" r="4.5" fill="#ffffff" />
            </svg>
          </div>
        </div>
        <svg id="tw1" class="twinkle" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="var(--main)" />
        </svg>
        <svg id="tw2" class="twinkle" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="var(--deep)" />
        </svg>
        <svg id="tw3" class="twinkle" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="var(--main)" />
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#mascot", { transformOrigin: "50% 100%" });
      gsap.set("#mascot-tilt", { transformOrigin: "50% 100%" });
      gsap.set("#bubble", { transformOrigin: "18% 95%" });

      // Respiração + postura pensativa (terminam exatamente na pose inicial)
      tl.fromTo("#mascot-breath", { y: 0 }, { y: -7, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#mascot-tilt", { rotation: -2 }, { rotation: 3.5, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#ground", { scaleX: 1 }, { scaleX: 0.94, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

      // Balão de pensamento respira suavemente (ciclo 1.2s x 2)
      tl.fromTo("#bubble", { scale: 1 }, { scale: 1.04, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#trail1", { scale: 1 }, { scale: 1.06, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.1);

      // --- ONDA CONTÍNUA E HIPNÓTICA DOS PONTINHOS (Fase 1: 0.0s a 1.2s) ---
      // Pulos escalonados estilo onda de digitação da IA
      tl.fromTo("#dot1", { y: 0, scale: 0.9, opacity: 0.5 }, { y: -12, scale: 1.15, opacity: 1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#dot2", { y: 0, scale: 0.9, opacity: 0.5 }, { y: -12, scale: 1.15, opacity: 1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.15);
      tl.fromTo("#dot3", { y: 0, scale: 0.9, opacity: 0.5 }, { y: -12, scale: 1.15, opacity: 1, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.30);

      // --- CLÍMAX DE INSIGHT (1.3s - 1.95s): Os pontos convergem e a estrela de IA reluz ---
      tl.to("#dots", { autoAlpha: 0, scale: 0.6, duration: 0.20, ease: "power1.in" }, 1.30);
      tl.fromTo("#insight-icon",
        { autoAlpha: 0, scale: 0.3, rotation: -45 },
        { autoAlpha: 1, scale: 1.15, rotation: 0, duration: 0.24, ease: "back.out(3)" },
        1.45
      );
      tl.to("#insight-icon", { scale: 1.0, duration: 0.16, ease: "sine.out" }, 1.69);
      tl.to("#insight-icon", { autoAlpha: 0, scale: 1.2, duration: 0.22, ease: "power1.in" }, 1.95);
      tl.to("#dots", { autoAlpha: 1, scale: 1, duration: 0.22, ease: "power1.out" }, 2.05);

      // Brilhos e sinapses cintilando ao redor do balão
      tl.fromTo("#tw1", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1.2, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.1);
      tl.fromTo("#tw2", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1.1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.4);
      tl.fromTo("#tw3", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1.1, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.7);

      // Motes e blobs em ciclo fechado e fluido (2.4s)
      tl.fromTo("#mote1", { y: 0 }, { y: -9, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#mote2", { y: -7 }, { y: 0, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#blob1", { scale: 1 }, { scale: 1.06, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#blob2", { scale: 1.06 }, { scale: 1, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      window.__timelines["think"] = tl;
    </script>
  </body>
</html>
